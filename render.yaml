services:
  - type: web
    name: reunite-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --no-input && gunicorn reunite_backend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: reunite-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: CLOUDINARY_CLOUD_NAME
        value: cqwhh4vv
      - key: CLOUDINARY_API_KEY
        value: "194877577911225"
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: reunite-db
    databaseName: reunite
    user: reunite
    plan: free
